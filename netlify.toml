# Static publish: serves app.html, design.html, data/*.json as-is.
# (The Next.js scaffold stays local-only for now; no build step on Netlify.)
[build]
  publish = "."
  command = ""

[build.environment]
  # Repo contains Next.js for local dev, but Netlify serves static files only.
  # Skip the auto-detected Next.js plugin, which fails with no Next build.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
