name: Refresh news data

on:
  schedule:
    - cron: "23 */4 * * *"   # every 4 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch live RSS headlines
        run: node scripts/fetch-rss.mjs --limit 8

      - name: Rebuild briefing, feed, alerts, metrics, digest
        run: |
          node scripts/briefing.mjs
          node scripts/ranker.mjs
          node scripts/alerts.mjs
          node scripts/metrics.mjs
          node scripts/digest.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh news data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
